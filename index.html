<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Trigger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .center-div { text-align: center; }
    .btn { margin: 10px; min-width: 200px; }
    #status { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="center-div">
    <h1 class="mb-4">Campaigns</h1>
    <button class="btn btn-primary btn-lg" onclick="triggerCampaign(1)">Campaign 1</button>
    <button class="btn btn-primary btn-lg" onclick="triggerCampaign(2)">Campaign 2</button>
    <div id="status" class="mt-4"></div>
  </div>
  <script>
    async function fetchData() {
      const res = await fetch('/api/campaign');
      return await res.json();
    }
    async function triggerCampaign(id) {
      await fetch(`/api/campaign/${id}`, { method: 'POST' });
      const data = await fetchData();
      updateUI(data);
    }
    function updateUI(data) {
      const status = document.getElementById('status');
      const c1Active = data.campaign1;
      const c2Active = data.campaign2;
      let html = '';
      html += `<button class="btn btn-lg mb-2 ${c1Active ? 'btn-success' : 'btn-outline-primary'}" disabled style="min-width:200px;width:200px">Campaign 1 ${c1Active ? '✅ ACTIVE' : ''}</button><br>`;
      html += `<button class="btn btn-lg mb-2 ${c2Active ? 'btn-success' : 'btn-outline-primary'}" disabled style="min-width:200px;width:200px">Campaign 2 ${c2Active ? '✅ ACTIVE' : ''}</button><br>`;
      html += `<div class="alert alert-info mt-3">Active: ${c1Active ? 'Campaign 1' : 'Campaign 2'}</div>`;
      status.innerHTML = html;
    }
    async function checkStatus() {
      const data = await fetchData();
      updateUI(data);
    }
    checkStatus();
  </script>
</body>
</html>
